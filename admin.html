<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Delbone 3D Maker</title><style>*{box-sizing:border-box}body{margin:0;background:#090710;color:#fff;font:16px Arial,sans-serif}main{max-width:650px;margin:auto;padding:24px}h1{color:#baff27}input,textarea,select,button{width:100%;padding:13px;margin:7px 0;border-radius:10px;font:inherit}input,textarea,select{background:#1d1725;color:white;border:1px solid #70518b}button{background:#baff27;border:0;color:#111;font-weight:bold;cursor:pointer}.danger{background:#ff8c8c}.muted{color:#b9b0c1}.item{border:1px solid #633582;padding:14px;border-radius:12px;margin:12px 0}.item img{width:100px;height:100px;object-fit:cover;border-radius:8px}label{display:block;margin-top:10px}#panel{display:none}a{color:#baff27}</style></head><body><main><h1>Delbone 3D Maker</h1><p class="muted">Painel administrativo de produtos</p><section id="login"><h2>Entrar</h2><input id="email" type="email" placeholder="E-mail" autocomplete="username"><input id="password" type="password" placeholder="Senha" autocomplete="current-password"><button id="enter">Entrar</button></section><section id="panel"><p id="who"></p><button id="exit">Sair</button><h2 id="formtitle">Novo produto</h2><form id="form"><input id="pid" type="hidden"><label>Nome<input id="nome" required maxlength="120"></label><label>Categoria<input id="categoria" required maxlength="60" placeholder="Ex.: Decoração"></label><label>Descrição<textarea id="descricao" rows="3"></textarea></label><label>Preço (opcional)<input id="preco" type="number" step="0.01" min="0"></label><label>Imagem (URL pública HTTPS)<input id="imagem" type="url" required placeholder="https://..."></label><label><input id="ativo" type="checkbox" checked style="width:auto"> Produto visível no catálogo</label><button type="submit">Salvar produto</button><button type="button" id="cancel">Limpar formulário</button></form><h2>Produtos cadastrados</h2><div id="items"></div></section><p id="msg" role="status"></p><p><a href="index.html">Voltar ao catálogo</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';
const allowed=['60aOabqiphaJvle6xn78yAIiuNA3','Zs43X80NrwdEpO7OBNNeBBb23tL2'];
const $=id=>document.getElementById(id),msg=t=>$('msg').textContent=t;
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith('COLE_'))msg('Configure firebase-config.js antes de utilizar o painel.');
else {
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let products=[];
$('enter').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){msg('Não foi possível entrar: '+e.code)}};
$('exit').onclick=()=>signOut(auth);$('cancel').onclick=clear;
onAuthStateChanged(auth,async u=>{const ok=u&&allowed.includes(u.uid);$('login').style.display=ok?'none':'block';$('panel').style.display=ok?'block':'none';if(u&&!ok){msg('Conta sem permissão de administrador.');await signOut(auth)}if(ok){$('who').textContent='Conectado: '+u.email;await load()}});
function clear(){$('form').reset();$('pid').value='';$('formtitle').textContent='Novo produto'}
async function load(){try{const snap=await getDocs(collection(db,'produtos'));products=snap.docs.map(d=>({id:d.id,...d.data()}));const root=$('items');root.replaceChildren();for(const p of products){const el=document.createElement('div');el.className='item';const title=document.createElement('strong');title.textContent=p.nome||'Sem nome';el.append(title);if(p.imagem){const img=document.createElement('img');img.src=p.imagem;img.alt='';el.append(document.createElement('br'),img)}const edit=document.createElement('button');edit.textContent='Editar';edit.onclick=()=>{for(const k of ['nome','categoria','descricao','preco','imagem'])$(k).value=p[k]??'';$('ativo').checked=p.ativo!==false;$('pid').value=p.id;$('formtitle').textContent='Editar produto';window.scrollTo(0,0)};const del=document.createElement('button');del.className='danger';del.textContent='Excluir';del.onclick=async()=>{if(confirm('Excluir este produto?')){try{await deleteDoc(doc(db,'produtos',p.id));await load()}catch(e){msg(e.message)}}};el.append(edit,del);root.append(el)}}catch(e){msg('Erro ao carregar produtos: '+e.message)}}
$('form').onsubmit=async e=>{e.preventDefault();if(!auth.currentUser||!allowed.includes(auth.currentUser.uid))return;const data={nome:$('nome').value.trim(),categoria:$('categoria').value.trim(),descricao:$('descricao').value.trim(),preco:$('preco').value?Number($('preco').value):null,imagem:$('imagem').value.trim(),ativo:$('ativo').checked,atualizadoEm:serverTimestamp()};if(!data.imagem.startsWith('https://'))return msg('Use uma URL HTTPS para a imagem.');try{const id=$('pid').value;if(id)await updateDoc(doc(db,'produtos',id),data);else await addDoc(collection(db,'produtos'),{...data,criadoEm:serverTimestamp()});msg('Produto salvo.');clear();await load()}catch(e){msg('Erro ao salvar: '+e.message)}};
}
</script></body></html>
